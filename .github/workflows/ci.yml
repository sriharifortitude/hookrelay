name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: hookrelay, POSTGRES_PASSWORD: hookrelay_local_dev, POSTGRES_DB: hookrelay }
        ports: ['5434:5432']
        options: --health-cmd "pg_isready -U hookrelay" --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6381:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://hookrelay:hookrelay_local_dev@127.0.0.1:5434/hookrelay?schema=public
      REDIS_URL: redis://127.0.0.1:6381
      ADMIN_API_KEY: ci-only-admin-key-not-a-secret-0000000000
      ALLOW_INSECURE_ENDPOINTS: 'true'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npm run test:integration
      - run: npm run build
      # The committed spec must match the routes; a drift here is a doc bug.
      - name: OpenAPI is up to date
        run: |
          cp openapi.json /tmp/committed.json
          npx tsx scripts/export-openapi.ts
          diff /tmp/committed.json openapi.json
