waivers:
  # POST /applications and POST /endpoints/{id}/rotate-secret both return
  # a freshly generated credential exactly once, by design: the route
  # schema itself documents this ("Shown once. Store it." on apiKey;
  # rotate-secret behaves identically). Neither GET /endpoints nor
  # GET /endpoints/{id} include apiKey or secret in their response
  # schemas -- confirmed by inspecting openapi.json directly, not
  # assumed -- so this is the standard "reveal a new credential once at
  # creation" pattern (the same one Stripe, GitHub PATs and AWS access
  # keys all use), not an over-exposure. apilint's sensitive-field rule
  # has no way to distinguish "shown once, on purpose" from "leaked on
  # every read" from the spec alone; a human has to.
  - rule: sensitive-field-in-response
    location: "POST /applications (201 response)"
    reason: apiKey is generated and returned exactly once at creation; never re-exposed on any GET
    expires: "2030-01-01"
  - rule: sensitive-field-in-response
    location: "POST /endpoints/{id}/rotate-secret (200 response)"
    reason: secret is generated and returned exactly once at rotation; never re-exposed on any GET
    expires: "2030-01-01"

  # Genuinely not accepted risk -- the README's own Limitations section
  # already says "No rate limiting per endpoint." Waived with a review
  # date rather than left to permanently fail the build, the same way
  # this portfolio treats every other known, tracked gap: an accepted
  # trade-off has a date to revisit it, not silence forever.
  - rule: missing-rate-limit-evidence
    location: "(whole document)"
    reason: "no rate limiting implemented yet (README Limitations); revisit before a non-internal deployment needs it"
    expires: "2027-03-01"
